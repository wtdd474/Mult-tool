<div class="buttons">
  <button id="download-btn">Download</button>
  <button id="underlined-btn">Underlined</button>
</div>

<script>
  document.getElementById('download-btn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.href = 'https://github.com/yourusername/yourrepo/raw/main/myfile.exe'; // Replace this with your file URL
    link.download = 'myfile.exe'; // Filename to save as
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  document.getElementById('underlined-btn').addEventListener('click', () => {
    window.open('random.html', '_blank');
  });
</script>
