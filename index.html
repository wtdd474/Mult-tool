<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: space-between;
    }
    .buttons {
      margin-bottom: 40px;
    }
    button {
      padding: 10px 20px;
      margin-right: 15px;
      font-size: 16px;
      cursor: pointer;
    }
    #underlined-btn {
      background: none;
      border: none;
      color: blue;
      text-decoration: underline;
      font-size: 16px;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }
    footer {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 40px;
      padding-top: 10px;
      border-top: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div class="buttons">
    <button id="download-btn">Download</button>
    <button id="underlined-btn">Underlined</button>
  </div>

  <footer>
    WE WILL NOT RE RESPONISBOL FOR ANY DAMAGE COST ON YOUR PC/LAPTOP/ANY DEVICE THAT CAN RUNS EXES
  </footer>

  <script>
    document.getElementById('download-btn').addEventListener('click', () => {
      alert('Download button clicked! You can add your download link here.');
      // You can replace above alert with code to download something if you want
    });

    document.getElementById('underlined-btn').addEventListener('click', () => {
      window.open('random.html', '_blank');
    });
  </script>
</body>
</html>
